[package]
name = "celily-lib"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ajanon/celily"
description = "Shared library for celily — launch ephemeral, network-isolated containers"
keywords = ["lxd", "incus", "container", "isolation", "sandbox"]
readme = "README.md"
authors = ["Alexis Janon"]

[lints.clippy]
pedantic = "warn"
missing_errors_doc = "allow"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bon = "3"
bytes = "1"
http = "1"
# Upstream 0.7.0 released the handler APIs celily builds on (HttpHandler
# embedding #196, DnsHandler #200, handle_tunnel #205) and re-issues legacy
# root CAs with a Subject Key Identifier (#216).
proxyapi = "0.7.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "process", "time", "macros", "sync", "io-util", "net"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
