name: Markdown
permissions:
  contents: read
on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/markdown.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/markdown.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04 # to be able to install mdformat
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mdformat
        run: |
          sudo apt-get update
          sudo apt-get install -y mdformat
      - name: Lint markdown
        run: |-
          mdformat --check .
