name: Integration tests
permissions:
  contents: read
on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "celily/share/**"
      - "builder/**"
      - "tests/integration/**"
      - ".github/workflows/integration.yml"
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "celily/share/**"
      - "builder/**"
      - "tests/integration/**"
      - ".github/workflows/integration.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test (${{ matrix.host }}, ${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: archlinux
            backend: lxd-distro
          - host: ubuntu-24.04
            backend: lxd-snap
    env:
      HOST: ${{ matrix.host }}
      BACKEND: ${{ matrix.backend }}
      # Also the artifact's name: unique in the run.
      JUNIT: junit-${{ matrix.host }}-${{ matrix.backend }}.xml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Toolchain, dependencies and build, for this host (builder/).
      # Restore and save apart: actions/cache saves only when the whole
      # job succeeds, and a failing test is when the next run comes.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: build-cache
        with:
          path: target/${{ matrix.host }}
          key: build-${{ matrix.host }}-${{ hashFiles('Cargo.lock') }}
      - name: Build celily
        run: python3 -m builder "${HOST}"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: target/${{ matrix.host }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - uses: lima-vm/lima-actions/setup@55627e31b78637bf254a8b2a14da8ea7d12564e5 # v1.1.0
        id: lima
        with:
          version: v2.3.0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: lima-cache
        with:
          path: ~/.cache/lima
          key: lima-${{ steps.lima.outputs.version }}-${{ matrix.host }}
      - name: Start the host
        run: tests/integration/driver.py up "${HOST}" --backend="${BACKEND}"
      # Even when the host failed after its image came: Lima downloads to
      # a temporary file, renamed when complete.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && steps.lima-cache.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cache/lima
          key: ${{ steps.lima-cache.outputs.cache-primary-key }}
      - name: Run the tests
        run: |-
          tests/integration/driver.py test "${HOST}" --backend="${BACKEND}" \
            --celily="target/${HOST}/debug/celily" --junitxml="${JUNIT}" -- -n auto
      # From here, failed tests included. No report: pytest never ran, or
      # stopped before writing it, and the steps above say why.
      - name: Summarize the tests
        if: ${{ !cancelled() && hashFiles(env.JUNIT) != '' }}
        run: tests/integration/summary.py "${JUNIT}" >> "${GITHUB_STEP_SUMMARY}"
      # Every test's output is in it (junit_logging), celily's log included.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles(env.JUNIT) != '' }}
        with:
          path: ${{ env.JUNIT }}
          archive: false
          retention-days: 7
      - name: Stop the host
        if: always()
        run: tests/integration/driver.py down "${HOST}" --backend="${BACKEND}"
